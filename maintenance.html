<body>
    <h1>設備預防保養管理 (Preventive Maintenance)</h1>
    <div class="content">
        <p>透過 SCADA 與 iFIX 圖控系統直接讀取設備實際運轉數據，將傳統「事後搶修」轉型為「事前預防保養」，大幅延長設備壽命並降低無預警停機造成的產能損失。</p>
        <ul>
            <li><strong>運轉時數與次數自動累計：</strong> 直接由 PLC 擷取馬達、冰水機、空壓機或閥門的實際運轉時數與啟停次數，取代人工抄表。</li>
            <li><strong>保養到期主動預警：</strong> 當設備達到設定的保養里程或週期時，圖控畫面自動彈出保養提醒，並發送通知給維護單位。</li>
            <li><strong>數位化保養履歷紀錄：</strong> 記錄歷次保養項目、更換零件與施作人員，建立完整的設備健康履歷以利稽核與追蹤。</li>
        </ul>
    </div>
