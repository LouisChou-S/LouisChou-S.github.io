<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="keywords" content="IFIX, 圖控軟體, 圖控系統, SCADA, FMCS系統, 配方管理, 電力分析, 報表">
    <title>監控軟體服務 與 IFIX圖控系統整合 | 智慧廠務系統</title>
    <style>
        :root { --primary-cyan: #00f3ff; --dark-bg: #0a0e17; --text-light: #e2e8f0; }
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background-color: var(--dark-bg); color: var(--text-light); background-image: linear-gradient(rgba(0, 243, 255, 0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 243, 255, 0.05) 1px, transparent 1px); background-size: 30px 30px; }
        
        /* 佔滿全寬的動態輪播 NAV */
        nav {
            position: fixed; top: 0; left: 0; width: 100%; height: 70px;
            background: rgba(10, 14, 23, 0.95); border-bottom: 1px solid rgba(0, 243, 255, 0.3);
            display: flex; justify-content: center; align-items: center; z-index: 1000;
        }
        .nav-item {
            position: absolute; width: 100%; text-align: center;
            font-size: 1.5rem; font-weight: bold; color: var(--primary-cyan);
            text-decoration: none; letter-spacing: 2px;
            opacity: 0; transition: opacity 0.5s ease-in-out, transform 0.3s;
            pointer-events: none; /* 隱藏時不可點擊 */
        }
        .nav-item.active { opacity: 1; pointer-events: auto; }
        .nav-item:hover { text-shadow: 0 0 15px var(--primary-cyan); transform: scale(1.02); }

        /* 首頁內容區塊 */
        .hero { margin-top: 100px; text-align: center; padding: 40px 20px; }
        .hero h1 { font-size: 2.5rem; color: #fff; }
        .hero p { max-width: 800px; margin: 20px auto; line-height: 1.8; color: #a0aec0; font-size: 1.1rem; }
        
        /* 解決方案網格 Grid (排版由下方的 JS 動態控制) */
        .solutions-grid { 
            display: grid; 
            gap: 20px; 
            max-width: 1000px; 
            margin: 0 auto 50px; 
            padding: 0 20px; 
        }
        
        /* 將方塊改成可以點擊的連結樣式 */
        .grid-card { 
            border: 1px solid rgba(0, 243, 255, 0.2); 
            padding: 20px; 
            text-align: left; 
            border-radius: 8px; 
            background: rgba(16, 26, 43, 0.8); 
            text-decoration: none; 
            color: var(--text-light);
            display: block;
            transition: all 0.3s;
        }
        .grid-card h3 { color: var(--primary-cyan); margin-top: 10px; }
        /* 強制 <p> 文字靠左，且最少要有 3 行的高度 */
        .grid-card p { 
            margin: 0; 
            color: #8892b0; 
            line-height: 1.6; 
            min-height: calc(1.6em * 3); /* 確保最小高度為 3 行 */
            text-align: left; /* 文字強制靠左 */
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .grid-card:hover {
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
            border-color: var(--primary-cyan);
            transform: translateY(-5px);
        }

        /* 手機版螢幕保護：螢幕太小時強制變成一排一個，避免擠在一起 */
        @media (max-width: 768px) {
            .solutions-grid { grid-template-columns: 1fr !important; }
        }
        
        footer { text-align: center; padding: 30px; border-top: 1px solid rgba(0, 243, 255, 0.3); }
        .contact-box { display: inline-block; margin: 10px; padding: 15px 30px; border: 1px solid var(--primary-cyan); border-radius: 50px; cursor: pointer; color: var(--primary-cyan); background: transparent; transition: 0.3s; }
        .contact-box:hover { background: rgba(0, 243, 255, 0.2); }
        #toast { visibility: hidden; background-color: var(--primary-cyan); color: #000; text-align: center; padding: 16px; position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%); border-radius: 4px; font-weight: bold; opacity: 0; transition: 0.3s; z-index: 1001;}
        #toast.show { visibility: visible; opacity: 1; }
    </style>
</head>
<body>

    <!-- 全螢幕輪播 NAV -->
    <nav id="dynamic-nav">
        <!--  <a href="RestAPI.html" class="nav-item active">探索解決方案：iFix RESTful API 服務 ➔</a>  -->
        <a href="recipe.html" class="nav-item">探索解決方案：配方管理 ➔</a>
        <a href="power.html" class="nav-item">探索解決方案：電力分析 ➔</a>
        <a href="fmcs.html" class="nav-item">探索解決方案：FMCS 系統 ➔</a>
        <a href="report.html" class="nav-item">探索解決方案：報表管理 ➔</a>
    </nav>

    <div class="hero">
        <h1>專注於 SCADA 架構設計與 IFIX 圖控軟體開發</h1>
        <p>在工業自動化的時代，系統的穩定性決定了企業的競爭力。我們不僅提供軟體層面的 IFIX 圖控開發與 SCADA 建置，更具備為大型廠房建立高可用性監控核心的深厚實力。</p>
    </div>

    <!-- 解決方案網格 -->
    <div class="solutions-grid" id="solutionsGrid">
        <!-- 點擊方塊也會跳轉到對應的子網頁 -->
        <!-- <a href="RestAPI.html" class="grid-card"><h3>iFix RESTful API</h3><p>建置邊緣端 RESTful API 服務，實現設備資料的隨需提取（On-demand Pull）機制。</p></a> -->
        <a href="fmcs.html" class="grid-card"><h3>FMCS系統圖控設計</h3><p>廠務設施，無縫整合</p></a>
        <a href="recipe.html" class="grid-card"><h3>配方功能</h3><p>快速切換不同產品的生產參數</p></a>
        <a href="power.html" class="grid-card"><h3>電力分析看板</h3><p>能耗監控，節能減碳</p></a>        
        <a href="report.html" class="grid-card"><h3>報表管理</h3><p>手自動生成，數據分享與稽核</p></a>
    </div>

    <footer>
        <!-- <div class="contact-box" onclick="copyToClipboard('09XX-XXX-XXX', '電話號碼')">複製電話：09XX-XXX-XXX</div>  -->
        <div class="contact-box" onclick="copyToClipboard('your.email@example.com', 'Email')">複製 Email：Andy.Chou445566@gmail.com</div>
    </footer>
    <div id="toast">已複製到剪貼簿！</div>

    <script>
        // 1. 動態計算方案數量，單數排3個，雙數排2個
        const gridContainer = document.getElementById('solutionsGrid');
        const gridCards = gridContainer.querySelectorAll('.grid-card');
        
        if (gridCards.length % 2 === 0) {
            // 數量為雙數 (例如 2, 4, 6)：一列顯示兩個
            gridContainer.style.gridTemplateColumns = 'repeat(2, 1fr)';
        } else {
            // 數量為單數 (例如 1, 3, 5)：一列顯示三個
            gridContainer.style.gridTemplateColumns = 'repeat(3, 1fr)';
        }

        // 2. NAV 每 3 秒輪播邏輯
        const navItems = document.querySelectorAll('.nav-item');
        let currentNav = 0;
        setInterval(() => {
            navItems[currentNav].classList.remove('active');
            currentNav = (currentNav + 1) % navItems.length;
            navItems[currentNav].classList.add('active');
        }, 3000);

        // 3. 複製到剪貼簿功能
        function copyToClipboard(text, type) {
            navigator.clipboard.writeText(text).then(() => {
                const toast = document.getElementById("toast");
                toast.innerText = type + " 已成功複製！";
                toast.className = "show";
                setTimeout(() => { toast.className = toast.className.replace("show", ""); }, 3000);
            });
        }
    </script>
</body>
</html>
