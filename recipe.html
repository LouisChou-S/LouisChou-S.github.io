<body>
    <h1>配方管理 (Recipe Management)</h1>
    <div class="content">
        <p>在複雜的生產線中，參數設定的錯誤往往會導致巨大的物料損失。如大型製造與化工廠往往需要大量設定變更製程參數，我們深知生產參數的精確度決定了產品良率。</p>
        <ul>
            <li><strong>IFIX / SCADA 深度整合：</strong> 支援多版本配方儲存，操作員一鍵下發參數至底層 PLC。</li>
            <li><strong>嚴格的防呆機制：</strong> 設定上下限卡控，防止人為輸入異常數值。</li>
            <li><strong>稽核軌跡 (Audit Trail)：</strong> 完整記錄「誰、在什麼時間、修改了什麼參數」，符合工業標準。</li>
        </ul>
    </div>
